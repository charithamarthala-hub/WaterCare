<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Profile - WaterCare</title>

<link rel="stylesheet" href="css/style.css">


<div class="logo-icon">
    💧
</div>

WaterCare


<button
    class="back-btn"
    onclick="goHome()"
>
    ← Home
</button>



<div class="create-header">

    <div class="avatar">
        👤
    </div>

    <h1>
        Create Your Profile
    </h1>

    <p class="subtitle">
        Add your personal details to create your WaterCare profile.
    </p>

</div>


<form onsubmit="createProfile(event)">


    <div class="form-group">

        <label>
            Full Name
            <span class="required">*</span>
        </label>

        <input
            type="text"
            id="createName"
            placeholder="Enter your full name"
            required
        >

    </div>


    <div class="form-group">

        <label>
            Email Address
            <span class="required">*</span>
        </label>

        <input
            type="email"
            id="createEmail"
            placeholder="Enter your email address"
            required
        >

    </div>


    <div class="form-group">

        <label>
            Phone Number
        </label>

        <input
            type="tel"
            id="createPhone"
            placeholder="Enter your phone number"
        >

    </div>


    <div class="form-group">

        <label>
            Location
        </label>

        <input
            type="text"
            id="createLocation"
            placeholder="Enter your location"
        >

    </div>


    <div class="button-row">

        <button
            type="submit"
            class="btn save-btn"
        >
            Create Profile
        </button>


        <button
            type="button"
            class="btn logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</form>



<div class="profile-header">

    <div
        class="profile-avatar"
        id="profileAvatar"
    >
        U
    </div>


    <h1 id="displayName"></h1>


    <p id="displayEmail"></p>

</div>



<div class="details">

    <h2>
        Personal Information
    </h2>


    <div class="detail-row">

        <span class="detail-label">
            👤 Full Name
        </span>

        <span
            class="detail-value"
            id="displayFullName"
        ></span>

    </div>


    <div class="detail-row">

        <span class="detail-label">
            📧 Email Address
        </span>

        <span
            class="detail-value"
            id="displayEmailDetail"
        ></span>

    </div>


    <div class="detail-row">

        <span class="detail-label">
            📱 Phone Number
        </span>

        <span
            class="detail-value"
            id="displayPhone"
        ></span>

    </div>


    <div class="detail-row">

        <span class="detail-label">
            📍 Location
        </span>

        <span
            class="detail-value"
            id="displayLocation"
        ></span>

    </div>

</div>



<div class="button-row">

    <button
        class="btn edit-btn"
        onclick="showEditProfile()"
    >
        ✏️ Edit Profile
    </button>


    <button
        class="btn logout-btn"
        onclick="logout()"
    >
        🚪 Logout
    </button>

</div>



<div
    class="success-message"
    id="successMessage"
>
    Profile updated successfully!
</div>



<div class="create-header">

    <div
        class="avatar"
        id="editAvatar"
    >
        👤
    </div>


    <h1>
        Edit Profile
    </h1>


    <p class="subtitle">
        Update your personal information.
    </p>

</div>



<div class="form-group">

    <label>
        Full Name
        <span class="required">*</span>
    </label>

    <input
        type="text"
        id="editName"
        required
    >

</div>



<div class="form-group">

    <label>
        Email Address
        <span class="required">*</span>
    </label>

    <input
        type="email"
        id="editEmail"
        required
    >

</div>



<div class="form-group">

    <label>
        Phone Number
    </label>

    <input
        type="tel"
        id="editPhone"
    >

</div>



<div class="form-group">

    <label>
        Location
    </label>

    <input
        type="text"
        id="editLocation"
    >

</div>



<div class="button-row">

    <button
        class="btn save-btn"
        onclick="saveEditedProfile()"
    >
        Save Changes
    </button>


    <button
        class="btn cancel-btn"
        onclick="cancelEdit()"
    >
        Cancel
    </button>

</div>



<script>

const profileDataKey =
    "watercareProfile";


function createProfile(event) {

    event.preventDefault();


    const profile = {

        name:
            document.getElementById(
                "createName"
            ).value,

        email:
            document.getElementById(
                "createEmail"
            ).value,

        phone:
            document.getElementById(
                "createPhone"
            ).value,

        location:
            document.getElementById(
                "createLocation"
            ).value

    };


    localStorage.setItem(
        profileDataKey,
        JSON.stringify(profile)
    );


    displayProfile();


    document
        .querySelector(
            "form"
        )
        .reset();

}


function displayProfile() {

    const storedProfile =
        localStorage.getItem(
            profileDataKey
        );


    if (!storedProfile) {

        return;
    }


    const profile =
        JSON.parse(
            storedProfile
        );


    document.getElementById(
        "displayName"
    ).textContent =
        profile.name;


    document.getElementById(
        "displayEmail"
    ).textContent =
        profile.email;


    document.getElementById(
        "displayFullName"
    ).textContent =
        profile.name;


    document.getElementById(
        "displayEmailDetail"
    ).textContent =
        profile.email;


    document.getElementById(
        "displayPhone"
    ).textContent =
        profile.phone || "Not provided";


    document.getElementById(
        "displayLocation"
    ).textContent =
        profile.location || "Not provided";


    const firstLetter =
        profile.name
            ? profile.name
                .charAt(0)
                .toUpperCase()
            : "U";


    document.getElementById(
        "profileAvatar"
    ).textContent =
        firstLetter;


    document.getElementById(
        "editAvatar"
    ).textContent =
        firstLetter;


    document.getElementById(
        "editName"
    ).value =
        profile.name;


    document.getElementById(
        "editEmail"
    ).value =
        profile.email;


    document.getElementById(
        "editPhone"
    ).value =
        profile.phone || "";


    document.getElementById(
        "editLocation"
    ).value =
        profile.location || "";

}


function showEditProfile() {

    document
        .getElementById(
            "editName"
        )
        .scrollIntoView({
            behavior: "smooth"
        });

}


function saveEditedProfile() {

    const profile = {

        name:
            document.getElementById(
                "editName"
            ).value,

        email:
            document.getElementById(
                "editEmail"
            ).value,

        phone:
            document.getElementById(
                "editPhone"
            ).value,

        location:
            document.getElementById(
                "editLocation"
            ).value

    };


    if (
        !profile.name ||
        !profile.email
    ) {

        alert(
            "Please enter your name and email."
        );

        return;
    }


    localStorage.setItem(
        profileDataKey,
        JSON.stringify(profile)
    );


    displayProfile();


    const message =
        document.getElementById(
            "successMessage"
        );


    message.style.display =
        "block";


    setTimeout(
        function() {

            message.style.display =
                "none";

        },
        3000
    );

}


function cancelEdit() {

    displayProfile();

}


function goHome() {

    window.location.href =
        "home.html";

}


function logout() {

    localStorage.removeItem(
        "watercareLoggedIn"
    );

    localStorage.removeItem(
        "watercareUserName"
    );

    localStorage.removeItem(
        "riskResult"
    );

    window.location.href =
        "thankyou.html";

}


displayProfile();

</script>
