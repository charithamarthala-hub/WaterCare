<nav>

    </p>


    <div class="map-area">

<script>

function logout() {

    localStorage.removeItem(
        "watercareLoggedIn"
    );

    localStorage.removeItem(
        "watercareUserName"
    );

    window.location.href =
        "thankyou.html";
}

</script>
