<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - WaterCare</title>

<link rel="stylesheet" href="css/style.css">


<div class="logo">
    💧 WaterCare
</div>


<div class="form-card">

    <div class="big-logo">
        💧
    </div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Login to your WaterCare account
    </p>


    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            required
        >


        <button
            type="submit"
            class="btn full"
        >
            Login
        </button>

    </form>


    <div id="message"></div>


    <div class="form-links">

        <a href="forgot-password.html">
            Forgot Password?
        </a>

        <a href="signup.html">
            Create Account
        </a>

    </div>

</div>


<script>

document.getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email")
                .value
                .trim();


        const password =
            document.getElementById("password")
                .value;


        const message =
            document.getElementById("message");


        try {

            const response =
                await fetch(
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


            const data =
                await response.json();


            if (data.status === "success") {

                localStorage.setItem(
                    "watercareLoggedIn",
                    "true"
                );


                localStorage.setItem(
                    "watercareUserName",
                    data.name
                );


                window.location.href =
                    "home.html";

            } else {

                message.textContent =
                    data.message;

            }

        } catch (error) {

            console.error(error);

            message.textContent =
                "Unable to connect to WaterCare server.";

        }

    });

</script>
