<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - WaterCare</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="landing-header">

    <div class="logo">
        💧 WaterCare
    </div>

</header>


<div class="form-container">

    <div class="form-card">

        <div class="big-logo">
            🔐
        </div>

        <h1>Forgot Password</h1>

        <p class="subtitle">
            Reset your WaterCare password
        </p>


        <form id="forgotForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                required
            >


            <label>New Password</label>

            <input
                type="password"
                id="newPassword"
                minlength="4"
                required
            >


            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                minlength="4"
                required
            >


            <button
                type="submit"
                class="btn full"
            >
                Reset Password
            </button>

        </form>


        <div id="message"></div>


        <div class="form-links">

            <a href="login.html">
                Back to Login
            </a>

        </div>

    </div>

</div>


<script>

document
.getElementById("forgotForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const email =
        document.getElementById("email").value.trim();

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    const user =
        JSON.parse(
            localStorage.getItem("waterCareUser")
        );


    if (!user || user.email !== email) {

        message.className = "error-message";

        message.innerText =
            "Email not found.";

        return;
    }


    if (newPassword !== confirmPassword) {

        message.className = "error-message";

        message.innerText =
            "Passwords do not match.";

        return;
    }


    user.password = newPassword;


    localStorage.setItem(
        "waterCareUser",
        JSON.stringify(user)
    );


    message.className = "success-message";

    message.innerText =
        "Password reset successfully!";


    setTimeout(function() {

        window.location.href = "login.html";

    }, 1000);

});

</script>

</body>
</html>
